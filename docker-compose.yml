services:
  dloxd:
    image: node:20-bookworm-slim
    container_name: dloxd
    working_dir: /app
    command: sh -c "npm install --omit=dev && exec node server.js"
    restart: unless-stopped
    init: true
    ports:
      - "5757:5757"
    environment:
      PORT: "5757"
      UPSTREAM_ORIGIN: "https://momo-edu.konami.net"
      ALLOWED_ROOT_HOSTS: "*"
      LOG_DIR: "/app/logs"
      UPSTREAM_TIMEOUT_MS: "30000"
      MAX_BODY_BYTES: "16777216"
      WS_QUEUE_MAX_BYTES: "1048576"
      SLOW_REQUEST_MS: "2000"
      TCP_KEEPALIVE_MS: "15000"
      NODE_ENV: "production"
    volumes:
      - /opt/apps/dloxd:/app
